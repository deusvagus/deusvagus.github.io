<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GI HSR Music Database V5.6.3</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* 字体大小类 */
        body.font-small {
            font-size: 14px !important;
        }
        body.font-medium {
            font-size: 16px !important;
        }
        body.font-large {
            font-size: 18px !important;
        }

        /* 确保搜索结果继承字体大小 */
        #results {
            font-size: inherit;
        }
        #results * {
            font-size: inherit;
        }

        /* 防止某些元素继承字体大小（如果需要） */
        .pagination,
        .control-group button {
            font-size: 14px;  /* 或其他固定大小 */
        }

        /* 防止设置面板文字被选中 */
        #settingsPanel {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        /* 允许输入框和选择框中的文字可以被选中 */
        #settingsPanel input,
        #settingsPanel select,
        #settingsPanel option {
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
        }

        /* 专辑搜索框样式 */
        .album-search {
            margin-bottom: 10px;
            padding: 0 10px;
        }
        
        .album-search input {
            width: 100%;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        
        /* 深色主题适配 */
        body:not(.light-mode) .album-search input {
            background-color: #333;
            color: #fff;
            border-color: #555;
        }

        /* 修改搜索框容器样式 */
        .search-input-container {
            position: relative;
            width: 100%;
            height: 28px;  /* 固定容器高度 */
        }

        .search-input-container input {
            width: 100%;
            padding: 5px 25px 5px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            height: 28px;
            box-sizing: border-box;
        }

        .clear-search {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 16px;
            width: 16px;
            height: 16px;
            padding: 0;
            display: none;
            text-align: center;
            line-height: 16px;
        }

        .clear-search:hover {
            color: #666;
        }

        /* 深色主题适配 */
        body:not(.light-mode) .clear-search {
            color: #888;
        }

        body:not(.light-mode) .clear-search:hover {
            color: #aaa;
        }

        /* 确保输入框有足够的右侧padding */
        #keywordInput,
        #albumSearchInput {
            padding-right: 25px !important;
        }

        /* 修改搜索控件样式 */
        .search-controls .search-input-container {
            display: inline-block;
            width: auto;
            vertical-align: middle;
            margin: 0 5px;
        }

        .search-controls input {
            width: auto;  /* 恢复原有宽度 */
        }

        /* 只保留清空按钮的样式，移除其他搜索框相关样式 */
        .search-controls .clear-search {
            position: absolute;
            right: 6px;
            top: 0;
            bottom: 0;
            margin: auto;
            width: 16px;
            height: 16px;
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            display: none;
            line-height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-controls .clear-search:hover {
            color: #666;
        }

        /* 深色主题适配 */
        body:not(.light-mode) .search-controls .clear-search {
            color: #888;
        }

        body:not(.light-mode) .search-controls .clear-search:hover {
            color: #aaa;
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="mobileControls" class="mobile-only">
            <button id="toggleSearch">搜索</button>
            <button id="toggleAlbums">专辑</button>
            <button id="toggleTools">工具</button>
            <button id="closeAllSections">关闭</button>
        </div>
        <div id="sidebar" class="collapsible">
            <button class="close-btn mobile-only">&times;</button>
            <div id="sidebar">
                <!-- <input type="file" id="fileInput"> -->
                <div id="albumList" class="album-list">
                    <h3>专辑列表</h3>
                    <div class="album-search">
                        <div class="search-input-container">
                            <input type="text" id="albumSearchInput" placeholder="搜索专辑...">
                            <button id="clearAlbumSearch" class="clear-search" title="清空搜索">&times;</button>
                        </div>
                    </div>
                    <div class="album-controls">
                        <button id="selectAllAlbums">全选</button>
                        <button id="deselectAllAlbums">全不选</button>
                        <button id="selectGenshinAlbums">原神全选</button>
                        <button id="selectStarRailAlbums">星铁全选</button>
                    </div>
                    <div id="albumCheckboxes"></div>
                </div>
            </div>
        </div>
        <div id="mainContent">
            <div id="searchSection" class="collapsible">
                <button class="close-btn mobile-only">&times;</button>
                <div id="searchSection">
                    <div class="search-controls">
                        <span class="settings-label">搜尋设置：</span>
                        <button id="allSearch" class="toggle-button active">全部</button>
                        <button id="titleSearch" class="toggle-button">标题</button>
                        <button id="composerSearch" class="toggle-button">作曲</button>
                        <button id="arrangerSearch" class="toggle-button">编曲</button>
                        <button id="otherSearch" class="toggle-button">其他</button>
                        <div style="position: relative; display: inline-block;">
                            <input type="text" id="keywordInput" placeholder="请输入关键字" style="padding-right: 25px;">
                            <button id="clearKeywordSearch" class="clear-search" title="清空搜索">&times;</button>
                        </div>
                        <button id="searchButton">搜索</button>
                    </div>
                    <div class="checkbox-group">
                        <span class="settings-label">显示设置：</span>
                        <label><input type="checkbox" id="composerCheckbox" checked> 作曲</label>
                        <label><input type="checkbox" id="arrangerCheckbox" checked> 编曲</label>
                        <label><input type="checkbox" id="otherCheckbox" checked> 其他</label>
                        <select id="sortOrder">
                            <option value="newest">新在前</option>
                            <option value="oldest">旧在前</option>
                        </select>
                    </div>
                </div>
            </div>
            <div id="results"></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>
    <div id="toolsPanel" class="collapsible">
        <button class="close-btn mobile-only">&times;</button>
        <div class="floating-controls">
            <div class="control-group">
                <span>全部曲目</span>
                <button id="expandAllTracks">展开</button>
                <button id="collapseAllTracks">折叠</button>
            </div>
            <div class="control-group">
                <span>全部专辑</span>
                <button id="expandAllAlbums">展开</button>
                <button id="collapseAllAlbums">折叠</button>
            </div>
            <div class="control-group">
                <button id="scrollToTopBtn" class="scroll-to-top">回到顶部</button>
                <button id="scrollToBottomBtn" class="scroll-to-bottom">滾動到底部</button>
            </div>
        </div>
    </div>
    <div id="settingsMenu">
    <button id="settingsBtn">设置</button>
        <div id="settingsPanel" style="display: none;">
            <h3>数据文件加载</h3>
            <div id="loadMessage"></div>
            <div>
                <input type="file" id="fileInput" accept=".json">
                <button id="loadFileBtn">加载文件</button>
            </div>
            <h3>UI 设置</h3>
            <label>
                字体大小：
                <select id="fontSizeSelect">
                    <option value="small">小</option>
                    <option value="medium" selected>中</option>
                    <option value="large">大</option>
                </select>
            </label>
            <label>
                主题：
                <select id="themeSelect">
                    <option value="light">浅色</option>
                    <option value="dark" selected>深色</option>
                </select>
            </label>
            <label>
                <span ondblclick="App.resetSidebarWidth()">侧边栏宽度：</span>
                <input type="range" id="sidebarWidthInput" 
                    min="250" 
                    max="600" 
                    value="400"
                    oninput="this.nextElementSibling.value = this.value">
                <output>400</output> px
            </label>
        </div>
    </div>
    <script src="js/theme.js"></script>
    <script src="js/ui-renderer.js"></script>
    <script src="js/search-module.js"></script>
    <script src="js/file-handler.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script src="js/mobile.js"></script>
</body>

</html>
